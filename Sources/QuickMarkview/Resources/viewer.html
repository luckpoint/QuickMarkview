<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{color-scheme:light dark;--fg:#24292f;--muted:#57606a;--border:#d0d7de;--code:#f6f8fa;--accent:#0969da;--diagram:#fff;--stash:#0969da14}@media(prefers-color-scheme:dark){:root{--fg:#e6edf3;--muted:#8b949e;--border:#30363d;--code:#161b22;--accent:#58a6ff;--diagram:#0d1117;--stash:#58a6ff1f}}*{box-sizing:border-box}body{margin:0;color:var(--fg);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:transparent}#layout{display:flex;min-height:100vh}#toc{-webkit-user-select:none;user-select:none;width:210px;flex:none;border-right:1px solid var(--border);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}#toc a{display:block;color:var(--muted);text-decoration:none;padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#toc a:hover{color:var(--accent)}.toc-1{font-weight:600}.toc-2{padding-left:15px!important}.toc-3,.toc-4,.toc-5,.toc-6{padding-left:28px!important;font-size:13px}main{max-width:960px;width:100%;margin:0 auto;padding:38px 54px 80px}h1,h2,h3,h4,h5,h6{line-height:1.25;margin:1.35em 0 .55em}h1{font-size:2em;border-bottom:1px solid var(--border);padding-bottom:.3em}h2{font-size:1.55em;border-bottom:1px solid var(--border);padding-bottom:.25em}p{margin:0 0 1em}a{color:var(--accent)}code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em;background:var(--code);padding:.12em .3em;border-radius:4px}pre{background:var(--code);border:1px solid var(--border);border-radius:7px;padding:14px 16px;overflow:auto}pre code{background:none;padding:0;white-space:pre}blockquote{margin:1em 0;padding:0 1em;color:var(--muted);border-left:3px solid var(--border)}li{margin:.2em 0}hr{border:0;border-top:1px solid var(--border);margin:1.5em 0}.mermaid{margin:22px 0;padding:18px;overflow:auto;border:1px solid var(--border);border-radius:8px;background:var(--diagram)}.mermaid-svg{display:block;max-width:none}.node{fill:var(--code);stroke:var(--accent);stroke-width:1.5}.edge{stroke:var(--muted);stroke-width:1.5;fill:none}.arrow{fill:var(--muted)}.lifeline{stroke:var(--border);stroke-dasharray:4 4}.mermaid-error{color:#cf222e;white-space:pre-wrap}img{max-width:100%}.stashed{background:var(--stash);box-shadow:-8px 0 0 var(--stash),-11px 0 0 var(--accent)}.stashed .stashed{background:none;box-shadow:none}#cursor{position:absolute;pointer-events:none;-webkit-user-select:none;user-select:none;background:var(--accent);opacity:.4;border-radius:2px}.quickmarkview-editor{position:fixed;z-index:20;width:min(400px,calc(100vw - 16px));padding:9px;background:var(--code);border:1px solid var(--accent);border-radius:7px;box-shadow:0 8px 28px #0004}.quickmarkview-editor textarea{display:block;width:100%;min-height:34px;max-height:160px;resize:none;border:0;outline:0;background:transparent;color:var(--fg);font:inherit}.quickmarkview-editor-hint{padding-top:4px;color:var(--muted);font-size:11px}
table{border-collapse:collapse;margin:0 0 1em;display:block;overflow:auto}
th,td{border:1px solid var(--border);padding:6px 13px}
th{background:var(--code);font-weight:600}
tr:nth-child(2n) td{background:color-mix(in srgb,var(--code) 50%,transparent)}
pre code.hljs{padding:0}.line{display:block;min-height:1.6em}
:root{--review-added:#1a7f37;--review-modified:#9a6700;--review-deleted:#cf222e;--review-panel:#fff}@media(prefers-color-scheme:dark){:root{--review-added:#3fb950;--review-modified:#d29922;--review-deleted:#ff7b72;--review-panel:#161b22}}
#content .review-added{background-image:linear-gradient(#2da44e18,#2da44e18);outline:1px solid color-mix(in srgb,var(--review-added) 45%,transparent);outline-offset:2px}
#content .review-modified{background-image:linear-gradient(#d4a72c20,#d4a72c20);outline:1px solid color-mix(in srgb,var(--review-modified) 45%,transparent);outline-offset:2px}
#review-marks{position:absolute;top:0;left:0;pointer-events:none;-webkit-user-select:none;user-select:none}
.review-marker{position:absolute;pointer-events:auto;min-width:30px;min-height:22px;padding:1px 4px;border:1px solid currentColor;border-radius:4px;background:var(--review-panel);font:11px/18px ui-monospace,monospace;cursor:pointer;white-space:nowrap}
.review-marker::before{content:attr(data-label)}.review-marker.review-added{color:var(--review-added)}.review-marker.review-modified{color:var(--review-modified)}.review-marker.review-deleted{color:var(--review-deleted)}.review-marker.review-current{outline:2px solid var(--accent);outline-offset:2px}
#review-details{position:fixed;z-index:30;right:16px;bottom:16px;width:min(620px,calc(100vw - 32px));padding:12px;background:var(--review-panel);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 28px #0004;font-size:12px}
#review-details[hidden]{display:none}#review-details button{float:right;color:var(--fg);background:var(--code);border:1px solid var(--border);border-radius:4px;padding:3px 8px;cursor:pointer}#review-details textarea{display:block;width:100%;height:180px;margin-top:10px;padding:8px;resize:vertical;white-space:pre;background:var(--code);color:var(--fg);border:1px solid var(--border);font:12px/1.6 ui-monospace,monospace}
</style><link rel="stylesheet" href="github.min.css" media="(prefers-color-scheme: light)"><link rel="stylesheet" href="github-dark.min.css" media="(prefers-color-scheme: dark)"></head><body><div id="layout"><nav id="toc" aria-label="Table of contents" hidden></nav><main id="content" tabindex="0"></main></div><div id="cursor" hidden></div><script src="markdown-it.min.js"></script><script src="mermaid.min.js"></script><script src="highlight.min.js"></script><script src="markdown_renderer.js"></script></body></html>
