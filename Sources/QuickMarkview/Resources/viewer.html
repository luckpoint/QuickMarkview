<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{color-scheme:light dark;--fg:#24292f;--muted:#57606a;--border:#d0d7de;--code:#f6f8fa;--accent:#0969da;--diagram:#fff}@media(prefers-color-scheme:dark){:root{--fg:#e6edf3;--muted:#8b949e;--border:#30363d;--code:#161b22;--accent:#58a6ff;--diagram:#0d1117}}*{box-sizing:border-box}body{margin:0;color:var(--fg);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:transparent}#layout{display:flex;min-height:100vh}#toc{-webkit-user-select:none;user-select:none;width:210px;flex:none;border-right:1px solid var(--border);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}#toc a{display:block;color:var(--muted);text-decoration:none;padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#toc a:hover{color:var(--accent)}.toc-1{font-weight:600}.toc-2{padding-left:15px!important}.toc-3,.toc-4,.toc-5,.toc-6{padding-left:28px!important;font-size:13px}main{max-width:960px;width:100%;margin:0 auto;padding:38px 54px 80px}h1,h2,h3,h4,h5,h6{line-height:1.25;margin:1.35em 0 .55em}h1{font-size:2em;border-bottom:1px solid var(--border);padding-bottom:.3em}h2{font-size:1.55em;border-bottom:1px solid var(--border);padding-bottom:.25em}p{margin:0 0 1em}a{color:var(--accent)}code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em;background:var(--code);padding:.12em .3em;border-radius:4px}pre{background:var(--code);border:1px solid var(--border);border-radius:7px;padding:14px 16px;overflow:auto}pre code{background:none;padding:0;white-space:pre}blockquote{margin:1em 0;padding:0 1em;color:var(--muted);border-left:3px solid var(--border)}li{margin:.2em 0}hr{border:0;border-top:1px solid var(--border);margin:1.5em 0}.mermaid{margin:22px 0;padding:18px;overflow:auto;border:1px solid var(--border);border-radius:8px;background:var(--diagram)}.mermaid-svg{display:block;max-width:none}.node{fill:var(--code);stroke:var(--accent);stroke-width:1.5}.edge{stroke:var(--muted);stroke-width:1.5;fill:none}.arrow{fill:var(--muted)}.lifeline{stroke:var(--border);stroke-dasharray:4 4}.mermaid-error{color:#cf222e;white-space:pre-wrap}img{max-width:100%}#cursor{position:absolute;pointer-events:none;-webkit-user-select:none;user-select:none;background:var(--accent);opacity:.4;border-radius:2px}
</style></head><body><div id="layout"><nav id="toc" aria-label="Table of contents"></nav><main id="content" tabindex="0"></main></div><div id="cursor" hidden></div><script src="markdown-it.min.js"></script><script src="mermaid.min.js"></script><script src="markdown_renderer.js"></script></body></html>
